name: lint

on:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: "pnpm"
      - name: Lint app
        run: |
          pnpm ci
          pnpm lint
